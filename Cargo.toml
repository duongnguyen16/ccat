[package]
name = "ccat"
version = "26.10.1"
edition = "2021"

[dependencies]
eframe = "0.36"
rfd = "0.17"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Time", "Win32_UI_HiDpi", "Win32_Graphics_Dwm"] }

[profile.release]
strip = true
lto = true
